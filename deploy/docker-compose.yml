services:
  litepan:
    build:
      context: ..
      dockerfile: Dockerfile.probe
    image: litepan:probe
    container_name: litepan
    restart: unless-stopped
    ports:
      - "5211:5211"
    environment:
      - TZ=Asia/Shanghai
    # 与镜像里的 USER 一致，保证数据卷文件属主是宿主用户
    user: "1000:1000"
    volumes:
      - ./data:/app/data
      - ./strm:/app/strm
      - ./mounts:/app/mounts
    devices:
      - /dev/fuse:/dev/fuse
